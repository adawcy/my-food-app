
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshTrack AI - 智能食物管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .card-expired { border-left: 5px solid #ef4444; }
        .card-warning { border-left: 5px solid #f59e0b; }
        .card-safe { border-left: 5px solid #10b981; }
        .tab-active { border-bottom: 3px solid #059669; color: #059669; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header -->
    <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span>🥗</span> FreshTrack AI
            </h1>
            <div class="flex gap-3">
                <button onclick="exportData()" title="備份資料" class="text-white hover:opacity-80 text-lg">📥</button>
                <button onclick="document.getElementById('importInput').click()" title="還原資料" class="text-white hover:opacity-80 text-lg">📤</button>
                <input type="file" id="importInput" class="hidden" accept=".json" onchange="importData(this)">
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 pb-24">
        <!-- Add Item Section -->
        <section class="bg-white rounded-2xl shadow-sm p-5 mb-6">
            <h2 class="text-lg font-bold mb-4 text-gray-800 flex items-center gap-2">
                <span class="text-emerald-500">➕</span> 新增食物項目
            </h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">食物名稱</label>
                    <input type="text" id="foodName" placeholder="例如：全脂牛奶" class="w-full border-gray-200 border rounded-xl p-3 focus:ring-2 focus:ring-emerald-500 outline-none transition">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">存放位置</label>
                        <select id="foodCategory" class="w-full border-gray-200 border rounded-xl p-3 bg-white focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="冷藏">❄️ 冷藏</option>
                            <option value="冷凍">🧊 冷凍</option>
                            <option value="常溫">🏠 常溫</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">到期日期</label>
                        <input type="date" id="expiryDate" class="w-full border-gray-200 border rounded-xl p-3 focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>

                <div class="flex gap-2">
                    <button onclick="document.getElementById('cameraInput').click()" class="flex-1 bg-blue-50 text-blue-600 font-semibold py-3 rounded-xl flex items-center justify-center gap-2 border border-blue-100 hover:bg-blue-100 transition">
                        📷 AI 掃描標籤
                    </button>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="processImage(this)">
                </div>

                <div id="status" class="text-center text-sm font-medium text-blue-600 hidden animate-pulse bg-blue-50 py-2 rounded-lg">
                    🤖 AI 正在辨識日期...
                </div>
                
                <button onclick="addItem()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl hover:bg-emerald-700 shadow-lg shadow-emerald-100 transition transform active:scale-95">
                    儲存至清單
                </button>
            </div>
        </section>

        <!-- Tabs / Filter -->
        <div class="flex border-b border-gray-200 mb-4 overflow-x-auto no-scrollbar">
            <button onclick="setFilter('全部')" id="tab-全部" class="flex-none px-4 py-2 font-medium tab-active transition">全部</button>
            <button onclick="setFilter('冷藏')" id="tab-冷藏" class="flex-none px-4 py-2 font-medium text-gray-500 transition">冷藏</button>
            <button onclick="setFilter('冷凍')" id="tab-冷凍" class="flex-none px-4 py-2 font-medium text-gray-500 transition">冷凍</button>
            <button onclick="setFilter('常溫')" id="tab-常溫" class="flex-none px-4 py-2 font-medium text-gray-500 transition">常溫</button>
        </div>

        <!-- Inventory List -->
        <section>
            <div class="flex justify-between items-center mb-4 px-1">
                <h2 class="font-bold text-gray-700">我的庫存 (<span id="itemCount">0</span>)</h2>
                <div class="text-xs text-gray-400">點擊垃圾桶刪除項目</div>
            </div>
            <div id="foodList" class="space-y-3">
                <!-- Items injected here -->
            </div>
            
            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-20">
                <div class="text-5xl mb-4">🍃</div>
                <p class="text-gray-400">清單空空如也，快去掃描食物吧！</p>
            </div>
        </section>
    </main>

    <!-- App Scripts -->
    <script>
        let inventory = JSON.parse(localStorage.getItem('freshTrackInventory')) || [];
        let currentFilter = '全部';

        // --- AI OCR Logic ---
        async function processImage(input) {
            const status = document.getElementById('status');
            const dateInput = document.getElementById('expiryDate');
            
            if (input.files && input.files[0]) {
                status.classList.remove('hidden');
                status.innerText = "🔍 正在分析包裝標籤...";
                
                try {
                    const result = await Tesseract.recognize(input.files[0], 'eng');
                    const lines = result.data.text.toUpperCase().split('\n');
                    
                    let detectedDate = null;
                    // Regex for YYYY-MM-DD, DD-MM-YYYY, MM/DD/YYYY, etc.
                    const dateRegex = /(\d{1,4}[-/.]\d{1,2}[-/.]\d{1,4})/;
                    const keywords = ["EXP", "BEST", "USE", "BEFORE", "BB", "SELL", "到期", "效期"];

                    for (let line of lines) {
                        const hasKeyword = keywords.some(kw => line.includes(kw));
                        const match = line.match(dateRegex);
                        
                        if (match) {
                            detectedDate = match[0];
                            if (hasKeyword) break; // High confidence
                        }
                    }
                    
                    if (detectedDate) {
                        const parsedDate = formatDateForInput(detectedDate);
                        if (parsedDate) {
                            dateInput.value = parsedDate;
                            status.innerText = "✅ 成功辨識日期！";
                            status.classList.replace('text-blue-600', 'text-green-600');
                        } else {
                            status.innerText = "❌ 格式無法解析，請手動輸入。";
                        }
                    } else {
                        status.innerText = "❓ 未能辨識日期，請手動輸入。";
                    }
                } catch (e) {
                    status.innerText = "⚠️ 辨識出錯，請重試。";
                }
                setTimeout(() => { 
                    status.classList.add('hidden');
                    status.classList.replace('text-green-600', 'text-blue-600');
                }, 3000);
            }
        }

        function formatDateForInput(dateStr) {
            // Replaces separator with '-' to help JS Date
            const cleanStr = dateStr.replace(/[./]/g, '-');
            const d = new Date(cleanStr);
            if (isNaN(d)) return '';
            return d.toISOString().split('T')[0];
        }

        // --- Inventory Logic ---
        function addItem() {
            const name = document.getElementById('foodName').value;
            const date = document.getElementById('expiryDate').value;
            const category = document.getElementById('foodCategory').value;

            if (!name || !date) {
                alert("請輸入食物名稱與到期日期");
                return;
            }

            const newItem = {
                id: Date.now(),
                name,
                date,
                category,
                addedOn: new Date().toISOString()
            };

            inventory.push(newItem);
            saveAndRender();
            
            document.getElementById('foodName').value = '';
            document.getElementById('expiryDate').value = '';
        }

        function deleteItem(id) {
            inventory = inventory.filter(item => item.id !== id);
            saveAndRender();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('button[id^="tab-"]').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('text-gray-500');
            });
            document.getElementById(`tab-${filter}`).classList.add('tab-active');
            document.getElementById(`tab-${filter}`).classList.remove('text-gray-500');
            renderList();
        }

        function saveAndRender() {
            inventory.sort((a, b) => new Date(a.date) - new Date(b.date));
            localStorage.setItem('freshTrackInventory', JSON.stringify(inventory));
            renderList();
        }

        function renderList() {
            const list = document.getElementById('foodList');
            const emptyState = document.getElementById('emptyState');
            const itemCount = document.getElementById('itemCount');
            
            const filteredData = currentFilter === '全部' 
                ? inventory 
                : inventory.filter(item => item.category === currentFilter);

            list.innerHTML = '';
            itemCount.innerText = filteredData.length;

            if (filteredData.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filteredData.forEach(item => {
                    const diffTime = new Date(item.date) - new Date().setHours(0,0,0,0);
                    const daysLeft = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    
                    let statusClass = 'card-safe';
                    let textClass = 'text-emerald-600';
                    let dayText = `剩餘 ${daysLeft} 天`;

                    if (daysLeft < 0) {
                        statusClass = 'card-expired';
                        textClass = 'text-red-600 font-bold';
                        dayText = '已過期';
                    } else if (daysLeft <= 3) {
                        statusClass = 'card-warning';
                        textClass = 'text-amber-600 font-bold';
                        dayText = `快到期 (剩 ${daysLeft} 天)`;
                    }

                    list.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center ${statusClass} transition active:scale-[0.98]">
                            <div>
                                <div class="flex items-center gap-2">
                                    <h3 class="font-bold text-gray-800">\${item.name}</h3>
                                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-100 text-gray-500">\${item.category}</span>
                                </div>
                                <p class="text-sm \${textClass}">\${dayText}</p>
                                <p class="text-[10px] text-gray-400">有效日期: \${item.date}</p>
                            </div>
                            <button onclick="deleteItem(\${item.id})" class="p-2 text-gray-300 hover:text-red-500 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    `;
                });
            }
        }

        // --- Backup Logic ---
        function exportData() {
            if (inventory.length === 0) return alert("目前沒有資料可以備份。");
            const dataStr = JSON.stringify(inventory, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `FreshTrack_Backup_\${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        if (confirm(`確定還原？這將覆蓋現有 \${inventory.length} 筆資料。`)) {
                            inventory = imported;
                            saveAndRender();
                            alert("還原成功！");
                        }
                    }
                } catch (err) { alert("無效的備份檔案。"); }
                input.value = '';
            };
            reader.readAsText(file);
        }

        // Initial render
        renderList();
    </script>
</body>
</html>
