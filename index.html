<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FreshTrack AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://unpkg.com/tesseract.js@v4.0.1/dist/tesseract.min.js'></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .card-expired { border-left: 5px solid #ef4444; }
        .card-warning { border-left: 5px solid #f59e0b; }
        .card-safe { border-left: 5px solid #10b981; }
        .tab-active { border-bottom: 3px solid #059669; color: #059669; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <header class="bg-emerald-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">🥗 FreshTrack AI</h1>
            <div class="flex gap-4">
                <button onclick="exportData()" class="text-xl">📥</button>
                <button onclick="document.getElementById('importInput').click()" class="text-xl">📤</button>
                <input type="file" id="importInput" class="hidden" accept=".json" onchange="importData(this)">
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 pb-24">
        <section class="bg-white rounded-2xl shadow-sm p-5 mb-6">
            <div class="flex gap-4 mb-6">
                <div onclick="document.getElementById('productCam').click()" class="w-24 h-24 bg-gray-100 rounded-xl flex flex-col items-center justify-center border-2 border-dashed border-gray-300 overflow-hidden shrink-0 relative">
                    <span id="prodHint" class="text-[10px] text-gray-400 text-center">拍攝<br>產品外觀</span>
                    <img id="productPreview" class="hidden w-full h-full object-cover">
                    <input type="file" id="productCam" accept="image/*" capture="environment" class="hidden" onchange="handleProductPhoto(this)">
                </div>

                <div class="flex-1 space-y-3">
                    <input type="text" id="foodName" placeholder="食物名稱 (選填)" class="w-full border-gray-200 border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-gray-50">
                    
                    <button onclick="document.getElementById('expiryCam').click()" class="w-full bg-blue-50 text-blue-600 font-semibold py-2 rounded-xl flex items-center justify-center gap-2 border border-blue-100 text-xs">
                        🔍 掃描日期標籤
                    </button>
                    <input type="file" id="expiryCam" accept="image/*" capture="environment" class="hidden" onchange="processExpiryAI(this)">
                </div>
            </div>

            <div id="status" class="text-center text-xs font-medium text-blue-600 hidden bg-blue-50 py-2 rounded-lg mb-4 animate-pulse">
                🤖 AI 正在辨識日期...
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 mb-1 ml-1">存放位置</label>
                    <select id="foodCategory" class="w-full border-gray-200 border rounded-xl p-2.5 bg-gray-50 text-sm outline-none">
                        <option value="冷藏">❄️ 冷藏</option>
                        <option value="冷凍">🧊 冷凍</option>
                        <option value="常溫">🏠 常溫</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 mb-1 ml-1">到期日期</label>
                    <input type="date" id="expiryDate" class="w-full border-gray-200 border rounded-xl p-2.5 bg-gray-50 text-sm outline-none">
                </div>
            </div>

            <button onclick="addItem()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-lg active:scale-95 transition">儲存項目</button>
        </section>

        <div class="flex border-b border-gray-200 mb-4 bg-white rounded-t-xl">
            <button onclick="setFilter('全部')" id="tab-全部" class="flex-1 py-3 font-medium tab-active transition text-sm">全部</button>
            <button onclick="setFilter('冷藏')" id="tab-冷藏" class="flex-1 py-3 font-medium text-gray-400 transition text-sm">冷藏</button>
            <button onclick="setFilter('冷凍')" id="tab-冷凍" class="flex-1 py-3 font-medium text-gray-400 transition text-sm">冷凍</button>
            <button onclick="setFilter('常溫')" id="tab-常溫" class="flex-1 py-3 font-medium text-gray-400 transition text-sm">常溫</button>
        </div>

        <div id="foodList" class="space-y-3"></div>
        <div id="emptyState" class="hidden text-center py-16 opacity-30 text-gray-400">清單空空如也</div>
    </main>

    <canvas id="compressCanvas" class="hidden"></canvas>

    <script>
        let inventory = JSON.parse(localStorage.getItem('freshTrackInventory')) || [];
        let currentFilter = '全部';
        let productBase64 = "";

        // 處理產品照片 (儲存用)
        function handleProductPhoto(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('compressCanvas');
                    const ctx = canvas.getContext('2d');
                    const size = 200;
                    canvas.width = size;
                    canvas.height = size;
                    // 裁切成正方形
                    const min = Math.min(img.width, img.height);
                    ctx.drawImage(img, (img.width-min)/2, (img.height-min)/2, min, min, 0, 0, size, size);
                    productBase64 = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('productPreview').src = productBase64;
                    document.getElementById('productPreview').classList.remove('hidden');
                    document.getElementById('prodHint').classList.add('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 處理 AI 日期辨識 (僅辨識，不儲存照片)
        async function processExpiryAI(input) {
            const status = document.getElementById('status');
            const dateInput = document.getElementById('expiryDate');
            const file = input.files[0];
            if (!file) return;

            status.classList.remove('hidden');
            status.innerText = "🤖 AI 正在讀取日期標籤...";

            try {
                const worker = await Tesseract.createWorker();
                await worker.loadLanguage('eng');
                await worker.initialize('eng');
                await worker.setParameters({ tessedit_char_whitelist: '0123456789/-. ' });
                
                const { data: { text } } = await worker.recognize(file);
                await worker.terminate();

                const match = text.match(/(\d{2,4}[-/.]\d{1,2}[-/.]\d{1,4})/);
                if (match) {
                    const d = new Date(match[0].replace(/[./]/g, '-'));
                    if (!isNaN(d)) {
                        dateInput.value = d.toISOString().split('T')[0];
                        status.innerText = "✅ 日期辨識成功！";
                    }
                } else {
                    status.innerText = "❓ 沒找到日期，請手動輸入";
                }
            } catch (err) {
                status.innerText = "❌ 辨識失敗";
            }
            setTimeout(() => status.classList.add('hidden'), 3000);
        }

        function addItem() {
            let name = document.getElementById('foodName').value.trim() || "未命名食物";
            const date = document.getElementById('expiryDate').value;
            if (!date) return alert("請輸入日期");

            inventory.push({
                id: Date.now(),
                name,
                date,
                category: document.getElementById('foodCategory').value,
                photo: productBase64
            });
            
            productBase64 = "";
            document.getElementById('foodName').value = "";
            document.getElementById('expiryDate').value = "";
            document.getElementById('productPreview').classList.add('hidden');
            document.getElementById('prodHint').classList.remove('hidden');
            saveAndRender();
        }

        function saveAndRender() {
            inventory.sort((a, b) => new Date(a.date) - new Date(b.date));
            localStorage.setItem('freshTrackInventory', JSON.stringify(inventory));
            renderList();
        }

        function renderList() {
            const list = document.getElementById('foodList');
            const data = currentFilter === '全部' ? inventory : inventory.filter(i => i.category === currentFilter);
            
            list.innerHTML = '';
            document.getElementById('emptyState').classList.toggle('hidden', data.length > 0);

            data.forEach(item => {
                const days = Math.ceil((new Date(item.date) - new Date().setHours(0,0,0,0)) / 86400000);
                const status = days < 0 ? 'card-expired' : (days <= 3 ? 'card-warning' : 'card-safe');
                
                list.innerHTML += `
                    <div class="bg-white p-3 rounded-xl shadow-sm flex items-center gap-3 ${status}">
                        ${item.photo ? `<img src="${item.photo}" class="w-14 h-14 rounded-lg object-cover border">` : `<div class="w-14 h-14 bg-gray-100 rounded-lg flex items-center justify-center text-xl">🍱</div>`}
                        <div class="flex-1">
                            <div class="flex items-center gap-2">
                                <h3 class="font-bold text-gray-800 text-sm">${item.name}</h3>
                                <span class="text-[9px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-500">${item.category}</span>
                            </div>
                            <p class="text-xs ${days < 0 ? 'text-red-500 font-bold' : (days <= 3 ? 'text-amber-600 font-bold' : 'text-emerald-600')}">
                                ${days < 0 ? '已過期' : (days === 0 ? '今天到期' : '剩餘 ' + days + ' 天')}
                            </p>
                        </div>
                        <button onclick="deleteItem(${item.id})" class="text-gray-300 p-2">🗑️</button>
                    </div>`;
            });
        }

        function deleteItem(id) {
            if (confirm("刪除此項目？")) {
                inventory = inventory.filter(i => i.id !== id);
                saveAndRender();
            }
        }

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('button[id^="tab-"]').forEach(b => {
                b.classList.toggle('tab-active', b.id === 'tab-' + f);
                b.classList.toggle('text-gray-400', b.id !== 'tab-' + f);
            });
            renderList();
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(inventory)], {type:'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `FreshTrack_Backup.json`;
            a.click();
        }

        function importData(input) {
            const reader = new FileReader();
            reader.onload = e => { 
                inventory = JSON.parse(e.target.result); 
                saveAndRender(); 
                alert("還原成功"); 
            };
            reader.readAsText(input.files[0]);
        }

        renderList();
    </script>
</body>
</html>
